name: "Test"
env:
  NPM_CONFIG_AUDIT: "false"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional tape test file glob(s) to run instead of the full test:sources suite"
        required: false
        default: ""
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v1
      with:
        node-version: "12"
    - name: "Pin registry time machine"
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T20:47:59.707000Z
    - name: "Install dependencies"
      run: |
        npm install
        rm -rf node_modules/@types/markdown-it
    - name: "Lint sources"
      run: npm run lint:sources -- --max-warnings 0
    - name: "Lint types"
      run: npm run lint:types
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node_version: ["12", "14", "16", "18"]
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node_version }}
    - name: "Pin registry time machine"
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T20:47:59.707000Z
    - name: "Install dependencies"
      run: |
        npm install
        rm -rf node_modules/@types/markdown-it
    - name: "Test sources"
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          npx tape -r ./lib/tape-adapter ${{ inputs.test-filter }}
        else
          npm run test:sources
        fi
    - name: "Test types"
      run: npm run test:types
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v1
    - uses: actions/setup-node@v1
      with:
        node-version: "12"
    - name: "Pin registry time machine"
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T20:47:59.707000Z
    - name: "Install dependencies"
      run: npm install
    - name: "Run benchmark"
      run: npm run bench
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "24.16.0"
    - name: "Use npm 11.16.0"
      run: npm install -g npm@11.16.0
    - name: "Pin registry time machine"
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-06-09T20:47:59.707000Z
    - name: "Install dependencies"
      run: npm install --ignore-scripts
    - name: "Install CLI dependencies"
      run: |
        npm --prefix cli install --ignore-scripts
        rm -rf node_modules/@types/markdown-it cli/node_modules/@types/markdown-it
    - name: "Build"
      run: npm run build
    - name: "Test sources"
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          npx tape -r ./lib/tape-adapter ${{ inputs.test-filter }}
        else
          npm run test:sources
        fi
    - name: "Test types"
      run: npm run test:types
    - name: "Pack"
      run: npm pack --ignore-scripts
    - uses: actions/upload-artifact@v4
      with:
        name: protobufjs-tgz
        path: protobufjs-*.tgz
        if-no-files-found: error
